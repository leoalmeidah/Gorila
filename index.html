<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Imagem</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#000}body{display:grid;place-items:center;overflow:hidden}img{display:block;max-width:100vw;max-height:100dvh;width:auto;height:auto;object-fit:contain} @supports not (height:100dvh){img{max-height:100vh}}
</style>
</head>
<body><img src="./gorila.png" alt="Gorila" fetchpriority="high"></body>
</html>
